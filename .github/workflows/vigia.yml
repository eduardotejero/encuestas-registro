# Vigía del registro.
#
# VIGÍA: comprueba desde FUERA del host que cada día tiene su foto. No se
# contenta con "foto o hueco": un hueco por avería avisa durante unos días, y
# más de dos huecos seguidos que lleguen hasta hoy avisan aunque sean
# operativos. Si no, una ingesta que reventase cada día dejaría un hueco cada
# día y el vigía callaría. Ver .github/vigia.py y .github/test_vigia.py.
#
# EL SITIO PÚBLICO SE RETIRÓ (3-nov-2026). Había un job `sitio` que construía
# una web estática desde el registro y la publicaba en GitHub Pages. Pages
# nunca se activó en este repositorio, así que ese job falló EN TODAS sus
# ejecuciones desde que se escribió —`configure-pages` devolvía «Get Pages
# site failed... Not Found»— y mandaba un correo de fallo cada hora, cada
# hora, durante semanas. Un workflow que siempre falla no informa de nada y
# entierra al vigía, que es el que sí importa.
#
# Se retira el job, no el constructor: `.github/construir_sitio.py` y su
# `test_sitio.py` siguen aquí y el test se sigue ejecutando abajo, para que no
# se podrezca. Si algún día se quiere la web, hay que ACTIVAR Pages en los
# ajustes del repositorio (o pasarle `enablement: true` a configure-pages) y
# devolver el job; mientras Pages esté apagado, publicarlo es imposible.
#
# POR QUÉ CADA HORA: ya no es por el apagón del sitio, sino por el vigía. Un
# publicador muerto se detecta dentro de la hora en vez de al día siguiente, y
# eso es exactamente lo que costó seis días en octubre.
#
# El cron va en UTC y no sigue el cambio de hora; es el script el que decide
# en hora peninsular.
name: vigía

on:
  schedule:
    - cron: "5 * * * *"
  push:
    branches: [main]
    paths:
      - "registro/**"
      - ".github/**"
  workflow_dispatch:

# Sólo lo que el vigía necesita: leer el registro y abrir/comentar/cerrar su
# issue. `pages: write` e `id-token: write` se fueron con el job del sitio.
permissions:
  contents: read
  issues: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.check.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar el vigía y el constructor del sitio
        run: |
          python .github/test_vigia.py
          python .github/test_sitio.py
      - name: Comprobar fotos y huecos
        id: check
        continue-on-error: true
        run: python .github/vigia.py .
      - name: Abrir, comentar o cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          MISSING: ${{ steps.check.outputs.missing }}
          BROKEN: ${{ steps.check.outputs.broken }}
        run: |
          gh label create "vigía" --color B60205 \
            --description "El registro no está saliendo" 2>/dev/null || true
          open=$(gh issue list --label "vigía" --state open --json number --jq '.[0].number')
          if [ "${{ steps.check.outcome }}" = "failure" ]; then
            body="$SUMMARY

          Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$open" ]; then
              # Un comentario por día basta: si ya hay uno de hoy, calla.
              hoy=$(date -u +%F)
              ultimo=$(gh issue view "$open" --json comments \
                --jq "[.comments[] | select(.createdAt | startswith(\"$hoy\"))] | length")
              [ "$ultimo" = "0" ] && gh issue comment "$open" --body "$body" || true
            else
              titulo="Registro: no está saliendo"
              [ -n "$MISSING" ] && titulo="Registro: faltan fotos ($MISSING)"
              [ -n "$BROKEN" ] && titulo="Registro: avería el $BROKEN"
              gh issue create --label "vigía" --title "$titulo" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Todo en orden: cada día exigible tiene foto, o un hueco operativo declarado y ninguna racha larga."
          fi

      # EL AVISO NO HACE FALLAR LA EJECUCIÓN (3-nov-2026).
      #
      # Antes había un job `avisar` que hacía `exit 1` cuando el vigía
      # encontraba algo. Con el cron horario eso es un correo de «workflow
      # failed» CADA HORA mientras el aviso siga en pie, y los avisos siguen
      # en pie durante horas o días por su naturaleza: «la última foto se
      # hizo con código viejo» no se puede apagar hasta la foto siguiente,
      # porque las fotos no se reemiten. Resultado: 24 correos al día por un
      # aviso que ya se había leído, y el verdadero se pierde entre ellos.
      #
      # LA ALARMA NO SE AFLOJA, CAMBIA DE CANAL. El aviso de verdad es el
      # ISSUE que abre el paso de arriba, y ese sí está pensado para no
      # repetirse: un comentario por día como mucho, y se CIERRA solo cuando
      # todo vuelve a estar en orden. Aquí queda una anotación de warning,
      # que sale en el resumen de la ejecución y no manda correo.
      #
      # Si algún día se quiere otra vez el rojo, el dato está en
      # `steps.check.outcome`; lo que no se puede es tenerlo cada hora.
      - name: Dejar el aviso en el resumen, sin tumbar la ejecución
        if: steps.check.outcome == 'failure'
        run: echo "::warning::El vigia ha encontrado algo. Esta en el issue con la etiqueta vigia y en el log del paso 'Comprobar fotos y huecos'."
