# Vigía del registro: comprueba desde FUERA del host que cada día tiene su
# foto o su hueco declarado. Ver .github/vigia.py.
#
# El cron de GitHub va en UTC y no sigue el cambio de hora: corre a las
# 07:15 y 08:15 UTC y es el script el que decide en hora peninsular
# (exige el día de hoy desde las 09:00 Europe/Madrid).
#
# Si falta algo: abre (o comenta) un único issue con la etiqueta «vigía» y
# el job FALLA, para que GitHub avise por correo. Cuando no falta nada,
# cierra el issue.
name: vigía del registro

on:
  schedule:
    - cron: "15 7,8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar fotos y huecos
        id: check
        continue-on-error: true
        run: python .github/vigia.py .
      - name: Abrir, comentar o cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          gh label create "vigía" --color B60205 \
            --description "Días del registro sin foto ni hueco declarado" 2>/dev/null || true
          open=$(gh issue list --label "vigía" --state open --json number --jq '.[0].number')
          if [ -n "$MISSING" ]; then
            body="Faltan en GitHub la foto y el hueco declarado de: $MISSING

          El publicador no ha empujado nada para esos días. O el host está caído,
          o la publicación está parada a propósito sin declarar el hueco.
          Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --label "vigía" --title "Registro: faltan fotos ($MISSING)" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Todo en orden: cada día exigible tiene foto o hueco declarado."
          fi
      - name: Fallar si falta algo
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Faltan fotos del registro: ${{ steps.check.outputs.missing }}"
          exit 1
