# Vigía del registro: comprueba desde FUERA del host que cada día tiene su
# foto. Ver .github/vigia.py (y sus pruebas, .github/test_vigia.py).
#
# No se contenta con "foto o hueco": un hueco por avería avisa el primer
# día, y más de dos huecos seguidos avisan aunque sean operativos. Si no,
# una ingesta que reventase cada día dejaría un hueco cada día y el vigía
# callaría: el mismo fallo que debe detectar lo satisfaría.
#
# El cron de GitHub va en UTC y no sigue el cambio de hora: corre a las
# 07:15 y 08:15 UTC y es el script el que decide en hora peninsular
# (exige el día de hoy desde las 09:00 Europe/Madrid).
name: vigía del registro

on:
  schedule:
    - cron: "15 7,8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probar el propio vigía
        run: python .github/test_vigia.py
      - name: Comprobar fotos y huecos
        id: check
        continue-on-error: true
        run: python .github/vigia.py .
      - name: Abrir, comentar o cerrar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          MISSING: ${{ steps.check.outputs.missing }}
          BROKEN: ${{ steps.check.outputs.broken }}
          STREAK: ${{ steps.check.outputs.streak }}
        run: |
          gh label create "vigía" --color B60205 \
            --description "El registro no está saliendo" 2>/dev/null || true
          open=$(gh issue list --label "vigía" --state open --json number --jq '.[0].number')
          if [ "${{ steps.check.outcome }}" = "failure" ]; then
            body="$SUMMARY

          Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              titulo="Registro: no está saliendo"
              [ -n "$MISSING" ] && titulo="Registro: faltan fotos ($MISSING)"
              [ -n "$BROKEN" ] && titulo="Registro: avería el $BROKEN"
              gh issue create --label "vigía" --title "$titulo" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Todo en orden: cada día exigible tiene foto, o un hueco operativo declarado y ninguna racha larga."
          fi
      - name: Fallar si el registro no está saliendo
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::${{ steps.check.outputs.summary }}"
          exit 1
